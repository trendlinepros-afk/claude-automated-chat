name: Build & Release

# Every push to main builds the Windows installer and publishes a GitHub Release.
# The installed app's auto-updater reads these releases (latest.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create a password-protected SMB share
        shell: pwsh
        run: ./scripts/ci-smb-share.ps1

      - name: Backup & restore over the real network share
        run: node test/smb-backup.js

      - name: Set version (major.minor from package.json, patch = run number)
        id: ver
        shell: bash
        run: |
          VERSION=$(node -e "const fs=require('fs');const p=require('./package.json');const [a,b]=p.version.split('.');p.version=a+'.'+b+'.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log(p.version)")
          echo "Version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Code signing switches on automatically once these repository secrets exist:
      #   WIN_CSC_LINK          base64 of your .pfx code-signing certificate
      #   WIN_CSC_KEY_PASSWORD  its password
      # When signed, electron-builder records the publisher name and the auto-updater
      # refuses any future update that is not signed by the same publisher.
      - name: Enable code signing (only if a certificate is configured)
        shell: bash
        env:
          L: ${{ secrets.WIN_CSC_LINK }}
          P: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$L" ]; then
            echo "CSC_LINK=$L" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "Code signing enabled"
          else
            echo "No signing certificate configured - building unsigned"
          fi

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Smoke test the packaged app (blocks the release if it fails to start)
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Publish GitHub release (read by the in-app auto-updater)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          ls -la dist
          gh release create "v$V" \
            "dist/Agent-Relay-Setup.exe" \
            "dist/Agent-Relay-Setup.exe.blockmap" \
            "dist/latest.yml" \
            --target "$GITHUB_SHA" \
            --title "Agent Relay v$V" \
            --notes "Automated build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
