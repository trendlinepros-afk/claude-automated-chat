name: CI

# Runs on every branch except main (main runs the full release workflow, which includes the same tests).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit / end-to-end tests
        run: npm test
      - name: Create a password-protected SMB share
        shell: pwsh
        run: ./scripts/ci-smb-share.ps1
      - name: Backup & restore over the real network share
        run: node test/smb-backup.js

      - name: One-paste setup script (PowerShell 5.1 + 7, real config merge, live MCP connection)
        run: node test/setup-script-win.js
      - name: Build the app (no publish)
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke test the packaged app
        shell: pwsh
        run: ./scripts/smoke-test.ps1
